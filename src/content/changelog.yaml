# What's new, newest release first. Shown on /whats-new, and each lesson change shows as a note on that
# lesson for people who had already started it. When a pull request changes the site or a lesson, add a
# release here (or add to the one it will ship in) and set the same version in package.json.
# Fields are listed in releaseSchema (src/course/schema.js).

- id: 0.4.0
  date: "2026-10-23"
  title: A project for the course, and where each lesson starts
  site:
    - Every lesson's intro says which lesson it builds on.
  lessons:
    - lesson: model-cycles/w01
      what: The lesson now opens by making a project just for the course, with a drawing of how projects, banks and patterns fit together. You save the project once at the start, so the last step only saves the pattern.
    - lesson: model-cycles/w04
      what: A Get ready step before the first Play step shows what B01 should hold from lesson 3, as a grid you can play, and how to get back to it.

- id: 0.3.0
  date: "2026-10-23"
  title: Rolls, velocity and the three speeds of an LFO
  lessons:
    - lesson: model-cycles/w03
      what: Clearer wording on VDEP. At 0 it stops velocity changing the volume, but velocity can still move other things.
    - lesson: model-cycles/w04
      what: A snare roll that rises into each new phrase, made from one trig with TRIG REPEAT.
    - lesson: model-cycles/w05
      what: Velocity as a second knob. Harder snare hits now ring longer, like a real drum.
    - lesson: model-cycles/w08
      what: "The three speeds of an LFO: a kick that fades in and out over bars, an envelope on pitch, and an LFO fast enough to change the tone itself."
    - lesson: model-cycles/w13
      what: Fast repeats as texture. A strummed chord with RETRIG, blurred with reverb, delay and a random LFO on the delay send.
    - lesson: model-cycles/w15
      what: An intro and outro that play themselves, with slow random LFOs on the chords and hats.
    - lesson: model-cycles/w16
      what: Play a snare roll live by holding RETRIG and a pad.

- id: 0.2.0
  date: "2026-10-23"
  title: Version numbers and What's new
  site:
    - The site now has a version number, shown at the bottom of every page, and this page lists what changed in each version.
    - A bell at the top of every page gets a dot when there's a version you haven't read about yet. Opening this page clears it.
    - When a lesson you've started changes, it shows a note saying what's new, until you mark it as read.
    - Your ticks are now kept by step rather than by position, so lessons can gain, lose or reorder steps without mixing up your progress.

- id: 0.1.0
  date: "2026-10-23"
  title: The course so far
  site:
    - Sixteen Model:Cycles lessons in four parts (Rhythm, Sound, Notes and harmony, Space and arrangement) and four song studies.
    - Your progress is saved in this browser, and you can download it or load it on another device from the Progress page.
    - Reference pages for the Model:Cycles panel, its machines, its shortcuts and how it saves your work.
