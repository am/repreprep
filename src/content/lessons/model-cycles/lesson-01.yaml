id: w01
number: 1
unit: Rhythm and time
title: Pulse, bars and the grid
goal: Feel the beat, count a bar in sixteenths, and see how the 16 trig keys are one bar of music.
listen: Bonobo, "Kiara". Tap your foot on every beat and count 1 2 3 4 out loud. Notice how the music changes every 4 or 8 bars.
concepts:
  - h: The beat, the bar and the grid
    p:
      - Almost all the music you love sits on a steady pulse, the beat. Tempo is how many beats come per minute (BPM). Beats are grouped in fours into bars (4/4 time), and the first beat of each bar, the downbeat, feels strongest.
      - 'Each beat splits into four sixteenths, counted "1 e & a, 2 e & a…". A bar has 16 of them, and the Model:Cycles has 16 trig keys: one key per sixteenth. That''s why keys 1, 5, 9 and 13 have underlined numbers on the unit: they are the four beats.'
  - h: Tempo shapes the feel
    p:
      - The same pattern feels heavy at 70 BPM and urgent at 130. Dub sits around 60–80, downtempo and trip hop around 80–105, house around 120–128, psytrance around 140. Your track for this course lives at 90 BPM.
  - h: Your track for the whole course
    p:
      - Every lesson adds something to one piece of music in pattern B01, in a project of its own. This lesson makes the project and sets the track's tempo and layout, and each lesson after it picks up B01 where the last one left it, until you perform and record the whole piece. The factory demos stay safe in their own project.
steps:
  - id: music-sits-steady-pulse
    k: learn
    fig: pulse
    t: "Music sits on a steady pulse, the beat: the thing you tap your foot to. Beats come in groups of four called bars. The first beat of each bar, the downbeat, feels strongest, which is why it's drawn bigger."
  - id: each-beat-splits-four
    k: learn
    fig:
      grid:
        title: One bar, 16 steps
        edit: false
        bpm: 90
        rows:
          - { n: Kick, s: kick, hits: "1,5,9,13" }
          - { n: Hat, s: hat, hits: "3,7,11,15", vel: 0.6 }
    t: 'Each beat splits into four sixteenths: "1 e & a". That makes 16 steps per bar, exactly the 16 trig keys on the Model:Cycles. The beats land on keys 1, 5, 9 and 13. Press Play and count along: "one e and a, two e and a…".'
    hear: The kick lands on every number you say, the hat on every "and".
  - id: tempo-beats-per-minute
    k: learn
    fig: tempo
    t: Tempo, in beats per minute, decides how a groove feels. Each style has a home range. Your track for this course sits at 90 BPM, between dub and downtempo, where Bonobo, Air and Burial's slower moments live.
  - id: where-music-lives
    k: learn
    fig: storage
    t: "Your music lives in a project. A project holds six banks, A to F, one per pad, and each bank holds 16 patterns, one per trig key. A pattern is one loop: six tracks with their sounds and trigs. Your track for this course is B01, bank B, pattern 1, and every lesson picks it up where the last one left it."
  - id: plug-headphones-speakers-press
    k: play
    t: Plug in headphones or speakers, then press and hold [MAIN VOLUME] to switch on. Keep the volume low and turn it up gently.
    hl: p:mainvol t:mainvol
  - id: make-course-project
    k: play
    t: "Make a project just for this course: press [SETTINGS], open PROJECT, turn [LEVEL/DATA] to NEW at the top of the list and press [LEVEL/DATA]. The new project is empty. It replaces the project you were in, so if you changed that one and want to keep it, save it first."
    hl: p:settings t:level
  - id: save-course-project
    k: play
    t: "Save it once, so every lesson can save into it: still in PROJECT, turn [LEVEL/DATA] to an empty ----- slot at the bottom of the list, press [LEVEL/DATA], choose SAVE and name it (hold [FUNC] and turn [LEVEL/DATA] to change a letter). Press [LEVEL/DATA] to confirm."
    hl: p:settings t:level h:func
    hear: From now on this is your course project. If you ever go to another project, load this one again from the same PROJECT menu with LOAD.
  - id: go-track-s-home
    k: play
    t: "Go to your track's home: hold [PATTERN], press [T2] (bank B), then press [TRIG 1]. You're on pattern B01. Everything in this course is built here."
    hl: h:pattern p:t2 p:s1
    hear: B01 on the screen.
  - id: tap-each-pad-each
    k: play
    t: Tap each pad [T1] to [T6]. Each plays its track's sound and makes that track active (its pad turns red).
    hl: p:t1 p:t2 p:t3 p:t4 p:t5 p:t6
    hear: "Six different sounds. Hit the pads harder and softer: they respond to how hard you play."
  - id: set-up-track-layout
    k: play
    t: "Set up the track layout you'll use all course: T1 KICK, T2 SNARE, T3 METAL (hats), T4 PERC, T5 TONE (bass), T6 CHORD (chords). For each one, hold [TRACK] and press the pad, press [MACHINES], turn [LEVEL/DATA] to the machine and press [BACK]."
    hl: h:track p:t1 p:machines t:level p:back
    hear: Same layout every lesson, so your hands learn where things are.
  - id: set-tempo
    k: play
    t: "Set the tempo: press [TEMPO], turn [LEVEL/DATA] to 90 BPM, then press [BACK]."
    hl: p:tempo t:level p:back
  - id: switch-metronome
    k: play
    t: 'Switch on the metronome: hold [FUNC] and press [GATE] for about a second. Press [PLAY] and count "1 e & a, 2 e & a…" over the clicks. Press [STOP].'
    hl: h:func p:gate p:play
    hear: The high click is the downbeat, the 1 of each bar.
  - id: put-kick-every-beat
    k: play
    t: "Put a kick on every beat: press [RECORD] so it lights (grid recording), select [T1], then press [TRIG 1], [TRIG 5], [TRIG 9] and [TRIG 13]. Press [PLAY]."
    hl: p:record h:track p:t1 p:s1 p:s5 p:s9 p:s13 p:play
    hear: "Four on the floor: a kick on each beat, lined up with the click."
  - id: press-leave-grid-recording
    k: play
    t: Press [RECORD] to leave grid recording. While it plays, tap [T3] on every "&", halfway between kicks. Then try tapping on every "e" and "a".
    hl: p:record p:t3
    hear: 'The "&"s are easy to find. The e''s and a''s are quick and slippery: that''s where groove will live.'
  - id: feel-tempo-change
    k: play
    t: "Feel tempo change: set [TEMPO] to 70, then to 120, listening to the same kick. Set it back to 90. Turn the metronome off (hold [FUNC] + [GATE])."
    hl: p:tempo t:level h:func p:gate
    hear: "Same four kicks: sleepy at 70, pushing at 120."
  - id: save-work
    k: play
    t: "Save your work: hold [FUNC] and long-press [SETTINGS] to save the pattern into your course project. Every lesson ends this way."
    hl: h:func p:settings
    hear: Switch off by holding [MAIN VOLUME], never by pulling the plug.
    more:
      text: How the Model:Cycles saves your work
      to: saving
  - id: which-trig-keys-four
    k: check
    t: Which trig keys are the four beats of a bar?
    q:
      - "!1, 5, 9, 13"
      - 1, 2, 3, 4
      - 1, 3, 5, 7
      - 4, 8, 12, 16
    a: 'Beats: 1, 5, 9, 13 (the underlined ones). The "&"s: 3, 7, 11, 15. All the even keys are e''s and a''s.'
    hear: Every idea in this course lands on this 16-step grid. Count everything in "1 e & a".
challenge: "Put on three songs you love and tap the beat. Guess their tempo using the TEMPO menu's tap function (hold [FUNC] and tap [TEMPO]). Write the numbers in your notes. Tapping changes your track's tempo too, so set it back to 90 BPM when you're done ([TEMPO], turn [LEVEL/DATA], [BACK])."
