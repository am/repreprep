id: w05
number: 5
unit: Sound
title: What makes a sound
goal: Describe any sound by its pitch, loudness, timbre and envelope, and reshape your kick and snare into soft, round night-time drums.
listen: Trentemøller, "Miss You". Listen to how gently each sound starts and how slowly it fades away, rather than how loud it is.
concepts:
  - h: Four things every sound has
    p:
      - "Pitch is how high or low it is. Loudness is how strong it is. Timbre is everything else: the reason a piano and a flute playing the same note, equally loud, still sound different. The fourth is the envelope: the sound's shape in time."
  - h: The envelope
    p:
      - "ADSR: attack (how fast it starts), decay (how fast it falls), sustain (the level it holds while you hold the key) and release (how long it fades after). A, D and R are times; S is a level. Drums are almost all attack and decay."
  - h: Words for sounds
    p:
      - 'Producers describe timbre in everyday words: round, soft, dusty, glassy, bright, dark. Naming what you want, like "a soft, round kick", makes it much easier to find with the knobs.'
  - h: Your kit, one sound at a time
    p:
      - Stock drum sounds are built to punch. This unit reshapes B01 for the night, one sound at a time, starting here with a soft, round kick and snare.
  - h: "Velocity can turn other knobs"
    p:
      - "On a real drum, a harder hit is louder and also rings longer. The Model:Cycles can copy that: the PAD menu sends velocity to one more destination, like DECAY, as well as to the volume."
steps:
  - id: every-sound-has-four
    k: learn
    fig: u2four
    t: "Every sound has four sides: pitch (high or low), loudness, timbre (its colour) and an envelope (its shape in time). Two sounds can share three of them and still feel completely different because of the fourth."
  - id: envelope-sound-s-shape
    k: learn
    fig: u2adsr
    t: "An envelope is a sound's shape in time. Attack: how fast it rises. Decay: how fast it falls to the sustain level. Sustain: the level held while you hold the key. Release: the fade after you let go."
    hear: A pad has a slow attack and long release. A drum is an instant attack and a decay.
  - id: model
    k: learn
    fig: u2gate
    t: "On the Model:Cycles every sound starts at full level at once and then decays, and [DECAY] sets how long. [GATE] adds a hold: the sound stays at full level while the pad is held, or for the trig's length, before it decays."
  - id: three-knobs-decide-if
    k: learn
    fig: u2kick
    t: Three knobs decide if a kick punches or rolls. [SWEEP] sets how far and how fast its pitch drops. [CONTOUR] adds a burst at the start that you hear as a click. [DECAY] sets how long it rings.
  - id: velocity-move-second-knob
    k: learn
    t: "Velocity can move a second knob. In the PAD menu ([FUNC] + [BACK]), FIX sets whether the pads play at one fixed velocity. VDEP sets how much velocity changes the volume. DST picks one more destination for velocity, and DDEP how far it moves it, up or down."
  - id: get-ready
    k: ready
    fig:
      pattern:
        slot: B01
        bpm: 90
        swing: 58
        bars:
          - - { n: T1 Kick, s: kick, hits: "1,9,11" }
            - { n: T2 Snare, s: snare, hits: "5,12:.2,13", nudge: "12:.3" }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,6:.24,7,8:.24,10:.24,11,12:.24,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12, new: "1,4,7,10" }
            - { n: T5 Tone, s: bass, hits: "" }
            - { n: T6 Chord, s: keys, hits: "" }
          - - { n: T1 Kick, s: kick, hits: "1,9,11" }
            - { n: T2 Snare, s: snare, hits: "5,12:.2,13,16:.24", nudge: "12:.3", new: "16" }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,6:.24,7,8:.24,10:.24,11,12:.24,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12, new: "1,4,7,10" }
            - { n: T5 Tone, s: bass, hits: "" }
            - { n: T6 Chord, s: keys, hits: "" }
          - - { n: T1 Kick, s: kick, hits: "1,9,11" }
            - { n: T2 Snare, s: snare, hits: "5,12:.2,13", nudge: "12:.3" }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,6:.24,7,8:.24,10:.24,11,12:.24,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12, new: "1,4,7,10" }
            - { n: T5 Tone, s: bass, hits: "" }
            - { n: T6 Chord, s: keys, hits: "" }
          - - { n: T1 Kick, s: kick, hits: "1,9,11", cond: { 9: "1:2", 11: "1:2" }, new: "9,11" }
            - {
                n: T2 Snare,
                s: snare,
                hits: "5,9,11,12:.2,13,14:.3,15:.3,16:.3",
                nudge: "12:.3",
                cond: { 9: FILL, 11: FILL, 14: "2:2", 15: "2:2" },
                new: "9,11,14,15,16",
              }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,6:.24,7,8:.24,10:.24,11,12:.24,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12, new: "1,4,7,10" }
            - { n: T5 Tone, s: bass, hits: "" }
            - { n: T6 Chord, s: keys, hits: "" }
    t: "Go to B01 (hold [PATTERN], press [T2], press [TRIG 1]). It should match the map. If not, hold [FUNC] and long-press [PATTERN] to reload the pattern you saved."
    hl: h:pattern p:t2 p:s1 h:func
  - id: go-b01-hold-press
    k: play
    t: Press [PLAY]. Mute the other tracks ([FUNC] + [T2] to [T6]) so only the kick plays. Select the kick (hold [TRACK], press [T1]) and tap [T1] a few times. Describe the stock kick in two words.
    hl: p:play h:func p:t2 p:t3 p:t4 p:t5 p:t6 h:track p:t1
    hear: "Stock kicks are usually punchy and clicky: good in a club, loud for night music."
  - id: make-round
    k: play
    t: "Make it round: turn [SWEEP] down until the pitch barely drops, and [CONTOUR] down until the click softens. Turn [COLOR] and [SHAPE] down too, for less modulation and a purer tone."
    hl: t:sweep t:contour t:color t:shape
    hear: A soft thump, closer to a low hum than a laser.
  - id: tune-lengthen
    k: play
    t: "Tune and lengthen it: hold [FUNC] and turn [PITCH] down 2 or 3 semitones. Turn [DECAY] up until each kick rings a little but stops before the kick on [TRIG 11]. Went too far? Press [BACK] within about three seconds to undo."
    hl: h:func t:pitch t:decay p:back
    hear: Deeper and rounder, with a short soft tail.
  - id: hear-sustain
    k: play
    t: "Hear a sustain: press [GATE] so it lights, then press and hold [T1] for a second before letting go. Try short and long holds. Press [GATE] again to switch it off."
    hl: p:gate h:t1
    hear: With GATE on, the kick holds at full level while you hold the pad, then decays when you let go.
  - id: hear-loudness-against-timbre
    k: play
    t: "Hear loudness against timbre: turn [VOLUME + DIST] up from 60 towards 90, then back to 60. Above 60 it gets louder and starts to distort."
    hl: t:vol
    hear: First just louder, then rougher. Distortion adds harmonics, which changes the timbre too.
  - id: soften-snare
    k: play
    t: "Soften the snare: unmute it ([FUNC] + [T2]) and select [T2]. If [PUNCH] is lit, press it to switch it off. Turn [SWEEP] and [CONTOUR] to 0: they make the crack at the start of each hit. Turn [SHAPE] down to about 30 to soften its noise, and leave [COLOR] at 0, since it adds clangy, metallic overtones. Hold [FUNC] and turn [PITCH] down 2 semitones. Turn [DECAY] down to about 30."
    hl: h:func p:t2 h:track p:t2 p:punch t:sweep t:contour t:shape h:func t:pitch t:decay
    hear: A dry, woody snare with no crack at the start. Your ghost note on [TRIG 12] softens with it.
  - id: make-harder-hits-ring
    k: play
    t: "Make harder hits ring longer: with [T2] selected, press [FUNC] + [BACK] to open the PAD menu. Leave FIX and VDEP as they are. Turn [LEVEL/DATA] to DST. With DST open for editing, turn the [DECAY] knob: DST jumps to DECAY. Then turn [LEVEL/DATA] to DDEP and set it to about +30. Press [BACK]."
    hl: h:func p:back t:level t:decay
    hear: "The backbeat snares ring a little longer, and the quiet ghost note on [TRIG 12] stays short and tight, like a real snare played softly."
  - id: write-two-words-new
    k: play
    t: "Unmute the other tracks ([FUNC] + [T3] to [T6]). Listen to the whole beat. In the Notes box under the lesson, press Edit and write two words for your new kick and two for your snare (round, soft, woody, dull…), then press Save. Then save the pattern: hold [FUNC] and long-press [SETTINGS]."
    hl: h:func p:t3 p:t4 p:t5 p:t6 p:settings
    hear: Same beat as lesson 4, but it now sounds like late at night.
  - id: turned-sweep-down-kick
    k: check
    t: You turned SWEEP down on the kick. What did that change?
    q:
      - How long it rings
      - "!How far its pitch drops after each hit"
      - How loud it is
      - How late it plays
    a: On the KICK machine, SWEEP sets the depth and time of the pitch sweep. A big, fast drop sounds punchy; a small one sounds round. DECAY is the knob for how long it rings.
    hear: "Shape the envelope first with [DECAY] and [GATE], then the colour with the four machine knobs: [COLOR], [SHAPE], [SWEEP] and [CONTOUR]."
challenge: "Pick a sound from a track you love and describe it in four words: one each for its pitch, loudness, timbre and envelope. Work on a copy so B01 stays ready for the next lesson: hold [PATTERN] + [TRIG 1] and press [RECORD], then hold [PATTERN] + [TRIG 3] and press and hold [STOP] until the countdown finishes. Go to B03 (hold [PATTERN], press [TRIG 3]). Try to get [T1] or [T2] close to it there."
