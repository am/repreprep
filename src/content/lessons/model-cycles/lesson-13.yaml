id: w13
number: 13
unit: Space, arrangement and finishing
title: Space and dub
goal: Place sounds near and far with reverb and delay sends, and play dub throws by hand.
listen: Augustus Pablo, "King Tubby Meets Rockers Uptown", then Burial, "Archangel". Listen for echoes that appear on a single hit and fade away, and for what stays dry and close.
concepts:
  - h: Near and far
    p:
      - A dry sound feels right next to you. A little reverb moves it back into a room; a lot puts it far away in a hall. Giving each part a different amount creates depth, front to back.
  - h: Sends and returns
    p:
      - The Model:Cycles has one reverb and one delay shared by all six tracks. Each track's send knob sets how much of it goes in; the effect knobs set the space for everyone. One shared room makes the parts sound like they play together.
  - h: Dub throws
    p:
      - Dub engineers played the mixer like an instrument. They kept kick and bass dry, opened the echo send for one snare or one word, then closed it again, and rode the feedback so the echoes swelled and died away.
  - h: "Repeats as texture"
    p:
      - "Repeat a chord fast enough and it stops sounding like separate hits: it becomes a tremolo or a strum. Short repeats with a short decay sound choppy; send them to reverb and delay and they blur into a shimmering texture."
steps:
  - id: reverb-sound-space-dry
    k: learn
    fig: u4depth
    t: Reverb is the sound of a space. Dry, a sound sits right next to you. Add a room and it steps back; add a hall and it floats far away. Mixing different amounts is how a track gets depth.
  - id: each-track-has
    k: learn
    fig: u4send
    t: "Each track has a [REVERB SEND] and a [DELAY SEND]: how much of it goes into the shared effects. [REVERB SIZE] and [DELAY TIME] shape those effects for all tracks at once, so the whole song sits in one space."
  - id: throw-sends-one-hit
    k: learn
    fig: u4dub
    t: "A throw sends one hit into the delay and lets its echoes carry on alone. DEL FEEDBACK sends the echoes back in again: low gives a few fading repeats, high makes them swell. Ride it up for a moment, then pull it back."
  - id: retrig-setup-sets-how
    k: learn
    t: "RETRIG SETUP ([FUNC] + [RETRIG]) sets how a pad repeats when you play it. RTE is the rate: 1/16 is one hit per step, 1/32 two. A.ON (always on) makes the pad repeat every time you press it, with no need to hold [RETRIG]."
  - id: get-ready
    k: ready
    fig:
      pattern:
        slot: B01
        bpm: 90
        swing: 58
        bars:
          - - { n: T1 Kick, s: kick, hits: "1,9,11" }
            - { n: T2 Snare, s: snare, hits: "5,12:.2,13", nudge: "12:.3" }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,5:.4,6:.24,7,8:.24,10:.24,11,12:.24,13:.4,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12 }
            - { n: T5 Tone, s: bass, hits: "1,11,15" }
            - { n: T6 Chord, s: keys, hits: "1" }
          - - { n: T1 Kick, s: kick, hits: "1,9,11" }
            - { n: T2 Snare, s: snare, hits: "5,12:.2,13,16:.24", nudge: "12:.3" }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,5:.4,6:.24,7,8:.24,10:.24,11,12:.24,13:.4,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12 }
            - { n: T5 Tone, s: bass, hits: "1,11,15" }
            - { n: T6 Chord, s: keys, hits: "1,9,11,13,15", cond: { 15: "50%" }, new: "9,11,13,15" }
          - - { n: T1 Kick, s: kick, hits: "1,9,11" }
            - { n: T2 Snare, s: snare, hits: "5,12:.2,13", nudge: "12:.3" }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,5:.4,6:.24,7,8:.24,10:.24,11,12:.24,13:.4,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12 }
            - { n: T5 Tone, s: bass, hits: "1,11,15" }
            - { n: T6 Chord, s: keys, hits: "1" }
          - - { n: T1 Kick, s: kick, hits: "1,9,11", cond: { 9: "1:2", 11: "1:2" } }
            - {
                n: T2 Snare,
                s: snare,
                hits: "5,9,11,12:.2,13,14:.3,15:.3,16:.3",
                nudge: "12:.3",
                cond: { 9: FILL, 11: FILL, 14: "2:2", 15: "2:2" },
              }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,5:.4,6:.24,7,8:.24,10:.24,11,12:.24,13:.4,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12 }
            - { n: T5 Tone, s: bass, hits: "1,11,15,16" }
            - { n: T6 Chord, s: keys, hits: "1,9,11,13,15", cond: { 15: "2:2" }, new: "9,11,13,15" }
    t: "Go to B01 (hold [PATTERN], press [T2], press [TRIG 1]). It should match the map. If not, hold [FUNC] and long-press [PATTERN] to reload the pattern you saved."
    hl: h:pattern p:t2 p:s1 h:func
  - id: play-b01-low-set
    k: play
    t: "Play B01 with [MAIN VOLUME] low. Set the shared room: turn [REVERB SIZE] to about 90. Then hold [FUNC] and turn [REVERB SIZE] to set REV TONE to about +20, which trims the lows from the reverb so it doesn't cloud the kick."
    hl: p:play t:mainvol t:revsize h:func
    hear: Any track that already sends to the reverb grows a longer tail.
  - id: set-echo
    k: play
    t: "Set the echo: turn [DELAY TIME] to 24, a dotted eighth. Then hold [FUNC] and turn [DELAY TIME] to set DEL FEEDBACK to about 40."
    hl: t:deltime h:func
    hear: "At 90 BPM a dotted eighth is half a second: echoes that land between the beats."
  - id: place-parts-near-far
    k: play
    t: Place parts near and far. Select [T1] and turn [REVERB SEND] and [DELAY SEND] fully left to OFF. Do the same on [T2] and [T5]. Then select [T3] and set [REVERB SEND] to about 30, and select [T6] and set it to about 70.
    hl: h:track p:t1 t:reverb t:delay p:t2 p:t5 p:t3 p:t6
    hear: Kick, snare and bass up front and solid, hats a step back, chords floating behind.
  - id: throw
    k: play
    t: "A throw: press [RECORD], press [PAGE] until the 4:4 light is on, and select [T2]. Hold [TRIG 13] and turn [DELAY SEND] to about 100."
    hl: p:record p:page h:track p:t2 h:s13 t:delay
    page: 4
    hear: "Once every four bars the last snare echoes away on its own. Its key flashes: it holds a lock."
  - id: room-shot
    k: play
    t: "A room shot: press [PAGE] until the 2:4 light is on, hold [TRIG 5] and turn [REVERB SEND] to about 110. Press [RECORD] to leave grid recording."
    hl: p:page h:s5 t:reverb p:record
    page: 2
    hear: One snare in bar 2 blooms into a big room, then the dry beat is straight back.
  - id: ride-feedback
    k: play
    t: "Ride the feedback: just after the throw in bar 4, hold [FUNC] and slowly turn [DELAY TIME] to raise DEL FEEDBACK towards 120. Bring it back to 40 within a bar or two. High feedback gets very loud, so keep [MAIN VOLUME] low."
    hl: h:func t:deltime t:mainvol
    hear: The echoes stop fading and start to swell, like a stalling engine. Pull back before they run away.
  - id: try-32-quarter-note
    k: play
    t: "Try [DELAY TIME] at 32 (a quarter note) and at 16 (an eighth), and keep the one that sits best. Then save: hold [FUNC] and long-press [SETTINGS]."
    hl: t:deltime h:func p:settings
    hear: Longer echoes feel slower and wider. Shorter ones feel busier.
  - id: strummed-chord
    k: play
    t: "A strummed chord: go to B04 (hold [PATTERN], press [TRIG 4]) and select [T6]. Press [FUNC] + [RETRIG], set RTE to 1/32 and A.ON to ON, then press [BACK]. Hold [T6] for a bar, then try [DECAY] short and long."
    hl: h:pattern p:s4 h:track p:t6 h:func p:retrig t:level p:back h:t6 t:decay
    hear: "The chord repeats fast while you hold the pad: choppy with a short decay, smoother with a long one."
  - id: blur
    k: play
    t: "Blur it: turn [DELAY SEND] and [REVERB SEND] up to about 80 on [T6] and hold [T6] again. Then press [LFO], set WAV to RND, DST to the delay send, MUL to 1K and DEP to about 40, and play it once more."
    hl: t:delay t:reverb h:t6 p:lfo t:level
    hear: "The repeats melt into a shimmer. With the fast random LFO on the send, each echo carries a little buzz of its own."
  - id: dub-mix-which-parts
    k: check
    t: In a dub mix, which parts usually stay dry?
    q:
      - "!Kick and bass"
      - Chords and pads
      - The snare
      - "None: everything goes into the echo"
    a: Kick and bass. They are the anchor, so they stay dry and solid. Echo and reverb go on snares, hats, chords and single throws, so the space moves around a steady centre.
    hear: Keep the low end dry. Throw single hits into space, then close the send.
challenge: Lock a [DELAY SEND] throw on one hat in bar 3 and a [REVERB SEND] room shot on one chord in bar 4. Keep only the throws that make you lean in.
