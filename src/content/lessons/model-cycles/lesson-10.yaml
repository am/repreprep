id: w10
number: 10
unit: Notes and harmony
title: Basslines
goal: Write a slow bassline that hits with the kick, plays the roots of your chord changes, and adds an octave jump and an approach note.
listen: 'Air, "La Femme d''Argent", then Augustus Pablo, "King Tubby Meets Rockers Uptown". Follow only the bass: when it plays, when it rests, and how often it comes back to the same note.'
concepts:
  - h: Three jobs
    p:
      - "A bassline keeps rhythm by hitting with the kick. It plays harmony by sitting on the root of each chord, which tells your ear where home is. And it adds a little melody: octave jumps and passing notes."
  - h: Start simple, add one move
    p:
      - "Start on one note in the kick's rhythm. Then add an octave jump, then an approach note: a note a step away that walks into the next root. Add one move at a time, and stop when it grooves."
  - h: Leave space
    p:
      - Bass notes are long and heavy, so the gaps matter. In dub the bass rests almost as much as it plays, and the silence is what makes each note land.
  - h: Note length on the Model:Cycles
    p:
      - With GATE on, a note holds for its trig length (LEN) before it decays. With GATE off, LEN is ignored and only DECAY sets how long it rings.
steps:
  - id: bassline-has-three-jobs
    k: learn
    fig: u3bassjobs
    t: "A bassline has three jobs. It hits with the kick, so the low end lands as one. It plays the root, which tells your ear what the chord is. And it moves a little: an octave up, or a note that walks into the next one."
  - id: same-bassline-built-one
    k: learn
    fig:
      grid:
        title: Building a bassline
        presets:
          - name: With the kick
            bpm: 90
            note: One note, A, on every kick.
            rows:
              - { n: Kick, s: kick, hits: "1,9,11" }
              - { n: Snare, s: snare, hits: "5,13" }
              - { n: Hat, s: hat, hits: "3,7,11,15", vel: 0.5 }
              - { n: Bass, s: bass, hits: "1,9,11", note: 45 }
          - name: Leave space
            bpm: 90
            note: "Drop the bass on beat 3: fewer notes, more weight."
            rows:
              - { n: Kick, s: kick, hits: "1,9,11" }
              - { n: Snare, s: snare, hits: "5,13" }
              - { n: Hat, s: hat, hits: "3,7,11,15", vel: 0.5 }
              - { n: Bass, s: bass, hits: "1,11", note: 45 }
          - name: Octave jump
            bpm: 90
            note: A hop up an octave at the end of the bar.
            rows:
              - { n: Kick, s: kick, hits: "1,9,11" }
              - { n: Snare, s: snare, hits: "5,13" }
              - { n: Hat, s: hat, hits: "3,7,11,15", vel: 0.5 }
              - { n: Bass, s: bass, hits: "1,11,15", p: [45, 0, 0, 0, 0, 0, 0, 0, 0, 0, 45, 0, 0, 0, 57, 0] }
          - name: Approach note
            bpm: 90
            note: A G on the last step walks up into the A on the 1.
            rows:
              - { n: Kick, s: kick, hits: "1,9,11" }
              - { n: Snare, s: snare, hits: "5,13" }
              - { n: Hat, s: hat, hits: "3,7,11,15", vel: 0.5 }
              - { n: Bass, s: bass, hits: "1,11,16", p: [45, 0, 0, 0, 0, 0, 0, 0, 0, 0, 45, 0, 0, 0, 0, 43] }
          - name: Too busy
            bpm: 90
            note: "Notes everywhere: the kick has nowhere to land."
            rows:
              - { n: Kick, s: kick, hits: "1,9,11" }
              - { n: Snare, s: snare, hits: "5,13" }
              - { n: Hat, s: hat, hits: "3,7,11,15", vel: 0.5 }
              - {
                  n: Bass,
                  s: bass,
                  hits: "1,2,3,5,7,8,9,11,12,13,15,16",
                  p: [45, 57, 45, 0, 45, 0, 57, 45, 45, 0, 45, 57, 45, 0, 57, 43],
                }
    t: "The same bassline, built one move at a time over your beat. Play the versions in order: each adds one idea. Then try the last one."
    hear: The octave and the approach note give it life. Too many notes, and the kick has nowhere to land.
  - id: bassline-ll-build-every
    k: learn
    fig: u3bassmap
    t: "This is the bassline you'll build. Every bar has the same rhythm, but the root changes: A, then F, D and E. Each root can carry its own chord, so the bass already tells the story."
  - id: get-ready
    k: ready
    fig:
      pattern:
        slot: B01
        bpm: 90
        swing: 58
        bars:
          - - { n: T1 Kick, s: kick, hits: "1,9,11" }
            - { n: T2 Snare, s: snare, hits: "5,12:.2,13", nudge: "12:.3" }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,5:.4,6:.24,7,8:.24,10:.24,11,12:.24,13:.4,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12 }
            - { n: T5 Tone, s: bass, hits: "1,4,7,11", new: "1,4,7,11" }
            - { n: T6 Chord, s: keys, hits: "" }
          - - { n: T1 Kick, s: kick, hits: "1,9,11" }
            - { n: T2 Snare, s: snare, hits: "5,12:.2,13,16:.24", nudge: "12:.3" }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,5:.4,6:.24,7,8:.24,10:.24,11,12:.24,13:.4,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12 }
            - { n: T5 Tone, s: bass, hits: "1,4,7,11", new: "1,4,7,11" }
            - { n: T6 Chord, s: keys, hits: "" }
          - - { n: T1 Kick, s: kick, hits: "1,9,11" }
            - { n: T2 Snare, s: snare, hits: "5,12:.2,13", nudge: "12:.3" }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,5:.4,6:.24,7,8:.24,10:.24,11,12:.24,13:.4,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12 }
            - { n: T5 Tone, s: bass, hits: "1,4,7,11", new: "1,4,7,11" }
            - { n: T6 Chord, s: keys, hits: "" }
          - - { n: T1 Kick, s: kick, hits: "1,9,11", cond: { 9: "1:2", 11: "1:2" } }
            - {
                n: T2 Snare,
                s: snare,
                hits: "5,9,11,12:.2,13,14:.3,15:.3,16:.3",
                nudge: "12:.3",
                cond: { 9: FILL, 11: FILL, 14: "2:2", 15: "2:2" },
              }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,5:.4,6:.24,7,8:.24,10:.24,11,12:.24,13:.4,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12 }
            - { n: T5 Tone, s: bass, hits: "1,4,7,11", new: "1,4,7,11" }
            - { n: T6 Chord, s: keys, hits: "" }
    t: "Go to B01 (hold [PATTERN], press [T2], press [TRIG 1]). It should match the map. If not, hold [FUNC] and long-press [PATTERN] to reload the pattern you saved."
    hl: h:pattern p:t2 p:s1 h:func
  - id: keep-last-lesson-s
    k: play
    t: "Keep last lesson's riff: with [RECORD] off, hold [PATTERN] + [TRIG 1] and press [RECORD]. Then hold [PATTERN] + [TRIG 11] and press and hold [STOP] until the countdown finishes. Stay on B01."
    hl: h:pattern p:s1 p:record p:s11 h:stop
    hear: B11 keeps the riff. B01 is where the bass goes.
  - id: press-select-clear-trigs
    k: play
    t: Press [RECORD], select [T5] and clear its trigs with [FUNC] + [PLAY]. Open the SCALE menu ([FUNC] + [PAGE]), check that T5's LEN is still 16, and press [BACK].
    hl: p:record h:track p:t5 h:func p:play p:page p:back
    hear: T5 is silent and one bar long, ready for the bass.
  - id: make-bass
    k: play
    t: "Make it a bass: hold [FUNC] and turn [PITCH] to -24 (two octaves down). Turn [SHAPE] down for a round, soft tone and [DECAY] to about 70. Press [GATE] so it lights: notes now hold for their length."
    hl: h:func t:pitch t:shape t:decay p:gate
    hear: "Tap [T5]: a deep, round note. If it vanishes on small speakers, use -12."
  - id: lock-kick
    k: play
    t: "Lock it to the kick: place bass notes on [TRIG 1], [TRIG 11] and [TRIG 15]. Make the first one long: hold [TRIG 1], press [LEVEL/DATA] until LEN shows, and turn it up to about 6."
    hl: p:s1 p:s11 p:s15 h:s1 p:level t:level
    hear: A long root on the 1 and a push with the kick on 11.
  - id: make-octave-jump
    k: play
    t: "Make [TRIG 15] the octave jump: hold it, hold [FUNC] too, and turn [PITCH] up to -12, one octave above the other notes."
    hl: h:s15 h:func t:pitch
    hear: A little hop at the end of the bar that pulls you back to the 1.
  - id: spread-over-four-bars
    k: play
    t: "Spread it over four bars: open the SCALE menu ([FUNC] + [PAGE]), press [T5], set LEN to 64 and press [BACK]. The trigs on page 1 are copied onto pages 2:4, 3:4 and 4:4."
    hl: h:func p:page p:t5 t:level p:back
    hear: The same bar four times, for now.
  - id: change-roots
    k: play
    t: "Change the roots: press [PAGE] until the 2:4 light is on, hold [TRIG 1], [TRIG 11] and [TRIG 15] together, press [LEVEL/DATA] until NOTE shows, and turn 4 semitones down. On 3:4: 7 down. On 4:4: 5 down."
    hl: p:page h:s1 h:s11 h:s15 p:level t:level
    page: 4
    hear: A, F, D, E. You can almost hear chords that aren't there yet.
  - id: add-approach-note
    k: play
    t: "Add the approach note: still on page 4:4, place a note on [TRIG 16], then hold the trig, press [LEVEL/DATA] until NOTE shows, and turn it 2 semitones down, to G. Press [RECORD], listen, and save (hold [FUNC], long-press [SETTINGS])."
    hl: p:page p:s16 h:s16 p:level t:level p:record h:func p:settings
    hear: "E, then G, then A at the top of the loop: the bass leans into its own beginning."
  - id: bass-plays-f-d
    k: check
    t: Your bass plays A, F, D and E, one root per bar. Which job is that?
    q:
      - Rhythm
      - "!Harmony: it plays the root of each chord"
      - Melody
      - Leaving space
    a: Playing the root of each chord is the harmony job. It tells your ear which chord you're on, even before any chords are playing.
    hear: Bass on the root, with the kick. Then add one move at a time.
challenge: "Make bar 4's approach note come and go: on page 4:4, hold [TRIG 16] in grid recording and turn [CHANCE] to 1:2. Listen to eight bars. Does the loop feel longer?"
