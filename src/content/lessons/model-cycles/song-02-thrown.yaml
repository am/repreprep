id: s02
song: Kiasmos – Thrown
unit: Kiasmos
title: Thrown
goal: Turn one short, plucked sound into chords by stacking it at different pitches, and build a moving groove out of harmony.
listen: Kiasmos, "Thrown" (from the album Kiasmos, 2014, first released on the Thrown EP in 2012). Listen for the short plucked chords that drive the track, and the bell-like melody above them.
concepts:
  - h: What Kiasmos said
    p:
      - Janus Rasmussen said the main pluck in Thrown is a Korg MS-20, a synth that plays one note at a time, recorded many times over so that it plays chords. Ólafur Arnalds said the track grew out of a remake of "Sudden Throw" from his album For Now I Am Winter. It was also their first track with strings. It runs at about 120 BPM.
  - h: A pluck
    p:
      - "A pluck starts sharply and dies quickly: short decay, no sustain. Played in a pattern, plucks work like a rhythm part that also has notes."
  - h: Stacking makes chords
    p:
      - One note at a time is a melody. The same sound at three pitches at once is a chord. A note, another 3 semitones above it and another 7 above the first make a minor chord.
steps:
  - id: ms-20-they-used
    k: learn
    fig: stack
    t: The MS-20 they used plays one note at a time. To get chords, they recorded the same pluck again and again at different notes and layered the recordings.
  - id: same-rhythm-first-single
    k: learn
    fig:
      grid:
        title: One pluck, then three
        presets:
          - name: Single notes
            bpm: 120
            note: The pluck rhythm on one note.
            rows:
              - { n: Pluck, s: pluck, note: 53, hits: "1,3,4,7,9,11,12,15", vel: 0.8 }
              - { n: Pluck +3, s: pluck, note: 56, hits: "" }
              - { n: Pluck +7, s: pluck, note: 60, hits: "" }
              - { n: Kick, s: kick, hits: "1,5,9,13" }
          - name: Stacked
            bpm: 120
            note: The same rhythm copied 3 and 7 semitones higher.
            rows:
              - { n: Pluck, s: pluck, note: 53, hits: "1,3,4,7,9,11,12,15", vel: 0.8 }
              - { n: Pluck +3, s: pluck, note: 56, hits: "1,3,4,7,9,11,12,15", vel: 0.65 }
              - { n: Pluck +7, s: pluck, note: 60, hits: "1,3,4,7,9,11,12,15", vel: 0.65 }
              - { n: Kick, s: kick, hits: "1,5,9,13" }
    t: The same rhythm, first as single notes, then stacked three high. Nothing new was written, only copied at other pitches. An example of the idea, not the song's own rhythm.
    hear: Stacked, the line turns into harmony.
  - id: go-study-s-own
    k: play
    t: "Go to this study's own pattern: hold [PATTERN], press [T3] (bank C), then press [TRIG 2]. If anything plays there, clear it with [FUNC] + [PLAY]. Press [TEMPO], set 120 BPM with [LEVEL/DATA], and press [BACK]."
    hl: h:pattern p:t3 p:s2 p:tempo t:level p:back
    hear: C02 on the screen, at 120 BPM.
  - id: set-machines-study-needs
    k: play
    t: "Set the machines this study needs, the same layout as your course track: T1 KICK, T3 METAL, T5 TONE, T6 CHORD. For each: hold [TRACK], press the pad, press [MACHINES], turn [LEVEL/DATA] to the machine and press [BACK]."
    hl: h:track p:machines t:level p:back
  - id: make-pluck
    k: play
    t: "Make a pluck: press [RECORD], select [T6], turn [SHAPE] to minor and [DECAY] down to about 20. The CHORD machine does the stacking for you: its voices play the same sound at different pitches."
    hl: p:record h:track p:t6 t:shape t:decay
    hear: "Tap [T6]: a short, plucked chord."
  - id: sequence
    k: play
    t: "Sequence it: on T6, place trigs on [TRIG 1], [TRIG 3], [TRIG 4], [TRIG 7], [TRIG 9], [TRIG 11], [TRIG 12] and [TRIG 15]. Press [PLAY]."
    hl: p:s1 p:s3 p:s4 p:s7 p:s9 p:s11 p:s12 p:s15 p:play
    hear: A rolling chord rhythm, the same one as in the grid.
  - id: make-move
    k: play
    t: "Make it move: on [TRIG 9], hold the trig, press [LEVEL/DATA] until NOTE shows, and turn it 2 semitones down. Do the same on [TRIG 11], [TRIG 12] and [TRIG 15]."
    hl: h:s9 p:level t:level h:s11 h:s12 h:s15
    hear: "The second half of the bar steps down: two chords from one sound."
  - id: add-bell-top
    k: play
    t: "Add a bell on top: select [T5] (TONE), turn [COLOR] up until it sounds like a bell and [DECAY] to about 70. Place notes on [TRIG 1] and [TRIG 9]. On [TRIG 9], hold the trig, press [LEVEL/DATA] until NOTE shows, and turn it 3 semitones up."
    hl: h:track p:t5 t:color t:decay p:s1 p:s9 h:s9 t:level
    hear: "A slow melody over a busy pluck: two speeds working together."
  - id: add-beat
    k: play
    t: "Add the beat: on T1, kicks on [TRIG 1], [TRIG 5], [TRIG 9] and [TRIG 13]. On T3, hats on [TRIG 3], [TRIG 7], [TRIG 11] and [TRIG 15]. Save: hold [FUNC] and long-press [SETTINGS]."
    hl: h:track p:t1 p:t3 h:func p:settings
  - id: how-did-kiasmos-get
    k: check
    t: How did Kiasmos get chords out of the MS-20 in Thrown?
    q:
      - "!They recorded the same pluck many times at different notes"
      - They used a chord preset
      - They sampled a piano
      - They ran it through a guitar pedal
    a: They layered it. Janus Rasmussen said the MS-20 pluck was layered many times to play chords. The CHORD machine on your Model:Cycles stacks a sound in the same way, inside a single track.
    hear: Copy the same sound at new pitches and a line becomes harmony.
challenge: Try other chord types on T6's [SHAPE] (sus2, m7) with the same rhythm, and keep the one that sounds most like night.
