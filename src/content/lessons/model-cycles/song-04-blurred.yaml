id: s04
song: Kiasmos – Blurred
unit: Kiasmos
title: Blurred
goal: Make a snare out of a sound that isn't a drum, and write a chord progression that climbs.
listen: Kiasmos, "Blurred" (from the Blurred EP, 2017). Listen to the hit on 2 and 4 first, then follow the chords and notice how they rise.
concepts:
  - h: What Kiasmos said
    p:
      - Janus Rasmussen said the snare in Blurred is actually Ólafur Arnalds hitting the piano. Reviews describe a simple drum beat, strings and a chord progression that climbs. It runs at about 122 BPM.
  - h: A snare is a job, not a sound
    p:
      - "In lesson 2 you met the snare's job: the backbeat on 2 and 4. Any short, sharp hit can do that job, whether it's the body of a piano, a book or a hand on a table. An unusual snare gives a track its own character."
  - h: Chords that climb
    p:
      - When each chord sits a little higher than the last, the music feels like it's lifting. Keeping the beat steady while the chords rise is a simple, strong way to build tension.
steps:
  - id: snare-role
    k: learn
    fig: snaresrc
    t: "The snare is a role: the hit on beats 2 and 4. In Blurred, that hit is Ólafur Arnalds striking the piano. Anything short and sharp can take the job."
  - id: switch-sound-2-4
    k: learn
    fig:
      grid:
        title: Same beat, different snare
        presets:
          - name: Snare
            bpm: 122
            rows:
              - { n: Kick, s: kick, hits: "1,5,9,13" }
              - { n: Backbeat, s: snare, hits: "5,13" }
              - { n: Hat, s: hat, hits: "3,7,11,15", vel: 0.5 }
          - name: Rim
            bpm: 122
            rows:
              - { n: Kick, s: kick, hits: "1,5,9,13" }
              - { n: Backbeat, s: rim, hits: "5,13" }
              - { n: Hat, s: hat, hits: "3,7,11,15", vel: 0.5 }
          - name: Wood knock
            bpm: 122
            rows:
              - { n: Kick, s: kick, hits: "1,5,9,13" }
              - { n: Backbeat, s: perc, hits: "5,13" }
              - { n: Hat, s: hat, hits: "3,7,11,15", vel: 0.5 }
          - name: Clap
            bpm: 122
            rows:
              - { n: Kick, s: kick, hits: "1,5,9,13" }
              - { n: Backbeat, s: clap, hits: "5,13" }
              - { n: Hat, s: hat, hits: "3,7,11,15", vel: 0.5 }
    t: Switch the sound on 2 and 4 while it plays. The groove stays the same and only the character changes.
    hear: Every version still has a backbeat. The job is the same and the feel is different.
  - id: four-minor-chords-each
    k: learn
    fig:
      grid:
        title: Chords that climb
        bpm: 122
        rows:
          - { n: Chord, s: keys, p: [57, 0, 0, 0, 60, 0, 0, 0, 62, 0, 0, 0, 64, 0, 0, 0], hits: "1,5,9,13", vel: 0.75 }
          - { n: Chord, s: keys, p: [60, 0, 0, 0, 63, 0, 0, 0, 65, 0, 0, 0, 67, 0, 0, 0], hits: "1,5,9,13", vel: 0.6 }
          - { n: Chord, s: keys, p: [64, 0, 0, 0, 67, 0, 0, 0, 69, 0, 0, 0, 71, 0, 0, 0], hits: "1,5,9,13", vel: 0.6 }
          - { n: Kick, s: kick, hits: "1,5,9,13" }
          - { n: Knock, s: perc, hits: "5,13", vel: 0.7 }
    t: Four minor chords, each a little higher than the last (0, 3, 5 and 7 semitones above the first). An example of the idea, not the song's own chords.
    hear: By the last chord you want to fall back to the first. That pull is what a rising progression gives you.
  - id: go-study-s-own
    k: play
    t: "Go to this study's own pattern: hold [PATTERN], press [T3] (bank C), then press [TRIG 4]. If anything plays there, clear it with [FUNC] + [PLAY]. Press [TEMPO], set 122 BPM with [LEVEL/DATA], and press [BACK]."
    hl: h:pattern p:t3 p:s4 p:tempo t:level p:back
    hear: C04 on the screen, at 122 BPM.
  - id: set-machines-study-needs
    k: play
    t: "Set the machines this study needs, the same layout as your course track: T1 KICK, T3 METAL, T4 PERC, T6 CHORD. For each: hold [TRACK], press the pad, press [MACHINES], turn [LEVEL/DATA] to the machine and press [BACK]."
    hl: h:track p:machines t:level p:back
  - id: make-piano-body-snare
    k: play
    t: "Make a piano-body snare: press [RECORD], select [T4] (PERC). Turn [PITCH] down a little, [DECAY] to about 40 and [COLOR] up until it sounds like knocking on wood. Place it on [TRIG 5] and [TRIG 13]."
    hl: p:record h:track p:t4 t:pitch t:decay t:color p:s5 p:s13
    hear: A dull, woody knock where the snare usually is.
  - id: add-beat-around
    k: play
    t: "Add the beat around it: on T1, kicks on [TRIG 1], [TRIG 5], [TRIG 9] and [TRIG 13]. On T3, hats on [TRIG 3], [TRIG 7], [TRIG 11] and [TRIG 15]. Press [PLAY]."
    hl: h:track p:t1 p:t3 p:play
    hear: Same groove as always, with a new voice on the backbeat.
  - id: add-chords
    k: play
    t: "Add the chords: select [T6] (CHORD), turn [SHAPE] to minor and [DECAY] to about 100. Place chords on [TRIG 1], [TRIG 5], [TRIG 9] and [TRIG 13]."
    hl: h:track p:t6 t:shape t:decay p:s1 p:s5 p:s9 p:s13
    hear: The same chord four times. Next, make it climb.
  - id: make-climb
    k: play
    t: "Make it climb: on [TRIG 5], hold the trig, press [LEVEL/DATA] until NOTE shows, and turn it 3 semitones up. On [TRIG 9], 5 up. On [TRIG 13], 7 up."
    hl: h:s5 p:level t:level h:s9 h:s13
    hear: Each chord a step higher than the last, then back down at the top of the bar.
  - id: save
    k: play
    t: "Save: press [RECORD] to leave grid recording, then hold [FUNC] and long-press [SETTINGS]."
    hl: p:record h:func p:settings
  - id: what-made-snare-sound
    k: check
    t: What made the snare sound in Blurred?
    q:
      - A classic drum machine snare
      - "!Ólafur Arnalds hitting the piano"
      - Finger snaps
      - A clap sample
    a: The piano. Janus Rasmussen said the snare is actually Ólafur hitting the piano. It still works as a snare because it's short, sharp and sits on 2 and 4.
    hear: The backbeat is a job. Any short, sharp sound on 2 and 4 can do it.
challenge: Record a real-world hit (a book, a table, a mug) with the Ableton Move's built-in microphone, and compare it with your PERC knock. Which fits the chords better?
