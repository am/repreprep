id: w15
number: 15
unit: Space, arrangement and finishing
title: From loop to song
goal: Turn your loop into a song of five sections, built by taking things away, and chain them in order.
listen: 'Bonobo, "Kiara". Draw its energy as a line while you listen: where parts arrive, where it drops back, and how it ends.'
concepts:
  - h: The energy curve
    p:
      - "A song is a journey in energy: start low, climb, peak, drop back for a break, rise again and fade out. Sketch the curve before you arrange; it tells you what each section has to do."
  - h: About three changes make a step
    p:
      - One change on its own slips by. Around three at once (a part arrives, another leaves, a sound opens up) and the ear hears a new section.
  - h: Build by subtraction
    p:
      - "Copy the full loop into every section, then take things away: removing is easier than inventing. Change something, keep something: every section keeps one thread, here the chords, so it stays one song."
  - h: Transitions
    p:
      - "Signal a change before it happens: take something out in the last bar, add a fill, or throw one hit into the delay. A part that keeps playing across the change carries the listener with you."
  - h: "A part that plays itself"
    p:
      - "In 1956 Bebe and Louis Barron scored the film Forbidden Planet with electronic circuits they built, each with its own behaviour. Synthesists later made self-playing patches in its spirit, where random values choose what each note does. A slow random LFO gives your intro some of that: it changes a little every few bars, with no one touching it."
steps:
  - id: energy-curve-song
    k: learn
    fig: u4energy
    t: "An energy curve for your song: intro, A, B, A again, B again, a break, a last B and an outro. Each step up is about three changes. The break drops low so the last B feels big again."
  - id: five-sections-sketch-switch
    k: learn
    fig:
      grid:
        title: Five sections, one loop
        presets:
          - name: Intro
            bpm: 90
            note: Hats and chords only.
            rows:
              - { n: Kick, s: kick, hits: "" }
              - { n: Snare, s: snare, hits: "" }
              - { n: Hat, s: hat, hits: "3,7,11,15", vel: 0.5 }
              - { n: Perc, s: perc, len: 12, hits: "" }
              - { n: Bass, s: bass, p: [45, 0, 0, 0, 0, 0, 0, 43, 45, 0, 48, 0, 0, 0, 0, 0], hits: "" }
              - { n: Chord, s: keys, note: 57, hits: "1,9", vel: 0.7 }
              - { n: Chord, s: keys, note: 60, hits: "1,9", vel: 0.6 }
          - name: A
            bpm: 90
            note: The beat and bass arrive. Fewer hats, no perc.
            rows:
              - { n: Kick, s: kick, hits: "1,9,11" }
              - { n: Snare, s: snare, hits: "5,13" }
              - { n: Hat, s: hat, hits: "3,11,15", vel: 0.5 }
              - { n: Perc, s: perc, len: 12, hits: "" }
              - { n: Bass, s: bass, p: [45, 0, 0, 0, 0, 0, 0, 43, 45, 0, 48, 0, 0, 0, 0, 0], hits: "1,8,9,11" }
              - { n: Chord, s: keys, note: 57, hits: "1,9", vel: 0.7 }
              - { n: Chord, s: keys, note: 60, hits: "1,9", vel: 0.6 }
          - name: B
            bpm: 90
            note: "The full loop: the peak."
            rows:
              - { n: Kick, s: kick, hits: "1,9,11" }
              - { n: Snare, s: snare, hits: "5,13" }
              - { n: Hat, s: hat, hits: "2,3:0.55,4,6,7:0.55,8,10,11:0.55,12,14,15:0.55,16", vel: 0.25 }
              - { n: Perc, s: perc, len: 12, hits: "1,4,7,10", vel: 0.5 }
              - { n: Bass, s: bass, p: [45, 0, 0, 0, 0, 0, 0, 43, 45, 0, 48, 0, 0, 0, 0, 0], hits: "1,8,9,11" }
              - { n: Chord, s: keys, note: 57, hits: "1,9", vel: 0.7 }
              - { n: Chord, s: keys, note: 60, hits: "1,9", vel: 0.6 }
          - name: Break
            bpm: 90
            note: "No kick, hats or perc: snare, bass and chords in space."
            rows:
              - { n: Kick, s: kick, hits: "" }
              - { n: Snare, s: snare, hits: "5,13", vel: 0.6 }
              - { n: Hat, s: hat, hits: "" }
              - { n: Perc, s: perc, len: 12, hits: "" }
              - { n: Bass, s: bass, p: [45, 0, 0, 0, 0, 0, 0, 43, 45, 0, 48, 0, 0, 0, 0, 0], hits: "1,8,9,11" }
              - { n: Chord, s: keys, note: 57, hits: "1,9", vel: 0.7 }
              - { n: Chord, s: keys, note: 60, hits: "1,9", vel: 0.6 }
          - name: Outro
            bpm: 90
            note: Kick and bass have left. The rest drifts on.
            rows:
              - { n: Kick, s: kick, hits: "" }
              - { n: Snare, s: snare, hits: "5,13", vel: 0.5 }
              - { n: Hat, s: hat, hits: "3,7,11,15", vel: 0.45 }
              - { n: Perc, s: perc, len: 12, hits: "1,4,7,10", vel: 0.4 }
              - { n: Bass, s: bass, p: [45, 0, 0, 0, 0, 0, 0, 43, 45, 0, 48, 0, 0, 0, 0, 0], hits: "" }
              - { n: Chord, s: keys, note: 57, hits: "1,9", vel: 0.7 }
              - { n: Chord, s: keys, note: 60, hits: "1,9", vel: 0.6 }
    t: Your five sections as a sketch. Switch through them while it plays. All five come from the same loop; each one leaves different things out.
    hear: The intro and the break still sound like the same song as the B, with space in them.
  - id: lesson-s-plan
    k: learn
    fig: u4map
    t: "This lesson's plan: copy B01 into B05 to B09, then clear tracks in each copy. B07 stays whole as the peak. The chords play in every section: that's the thread that keeps it one song."
  - id: intro-has-room-something
    k: learn
    t: "An intro has room for something that plays itself. A random LFO picks a new value each cycle. Give two parts random LFOs at different speeds and they drift against each other, so the intro never repeats exactly, even though nothing in the pattern changes."
  - id: get-ready
    k: ready
    fig:
      pattern:
        slot: B01
        bpm: 90
        swing: 58
        bars:
          - - { n: T1 Kick, s: kick, hits: "1,9,11" }
            - { n: T2 Snare, s: snare, hits: "5,12:.2,13", nudge: "12:.3" }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,5:.4,6:.24,7,8:.24,10:.24,11,12:.24,13:.4,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12 }
            - { n: T5 Tone, s: bass, hits: "1,11,15" }
            - { n: T6 Chord, s: keys, hits: "1" }
          - - { n: T1 Kick, s: kick, hits: "1,9,11" }
            - { n: T2 Snare, s: snare, hits: "5,12:.2,13,16:.24", nudge: "12:.3" }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,5:.4,6:.24,7,8:.24,10:.24,11,12:.24,13:.4,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12 }
            - { n: T5 Tone, s: bass, hits: "1,11,15" }
            - { n: T6 Chord, s: keys, hits: "1,9,11,13,15", cond: { 15: "50%" } }
          - - { n: T1 Kick, s: kick, hits: "1,9,11" }
            - { n: T2 Snare, s: snare, hits: "5,12:.2,13", nudge: "12:.3" }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,5:.4,6:.24,7,8:.24,10:.24,11,12:.24,13:.4,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12 }
            - { n: T5 Tone, s: bass, hits: "1,11,15" }
            - { n: T6 Chord, s: keys, hits: "1" }
          - - { n: T1 Kick, s: kick, hits: "1,9,11", cond: { 9: "1:2", 11: "1:2" } }
            - {
                n: T2 Snare,
                s: snare,
                hits: "5,9,11,12:.2,13,14:.3,15:.3,16:.3",
                nudge: "12:.3",
                cond: { 9: FILL, 11: FILL, 14: "2:2", 15: "2:2" },
              }
            - { n: T3 Hats, s: hat, hits: "2:.24,3,4:.24,5:.4,6:.24,7,8:.24,10:.24,11,12:.24,13:.4,14:.24,15,16:.24" }
            - { n: T4 Perc, s: perc, hits: "1,4,7,10", len: 12 }
            - { n: T5 Tone, s: bass, hits: "1,11,15,16" }
            - { n: T6 Chord, s: keys, hits: "1,9,11,13,15", cond: { 15: "2:2" } }
    t: "Go to B01 (hold [PATTERN], press [T2], press [TRIG 1]). It should match the map. If not, hold [FUNC] and long-press [PATTERN] to reload the pattern you saved."
    hl: h:pattern p:t2 p:s1 h:func
  - id: get-b01-ready-hand
    k: play
    t: "Get B01 ready to hand over: open the SCALE menu ([FUNC] + [PAGE]), set CHG to 64 and press [BACK]. In TRACK mode a pattern otherwise never ends, so the next one would never start. Save: hold [FUNC], long-press [SETTINGS]."
    hl: h:func p:page t:level p:back p:settings
    hear: No change in sound. B01 can now hand over to another pattern every 4 bars.
  - id: copy-b01-five-slots
    k: play
    t: "Copy B01 into five slots: hold [PATTERN] + [TRIG 1] and press [RECORD]. Then hold [PATTERN] + [TRIG 5] and press and hold [STOP] until the countdown finishes. Repeat for [TRIG 6], [TRIG 7], [TRIG 8] and [TRIG 9]."
    hl: h:pattern h:s1 p:record h:s5 h:stop h:s6 h:s7 h:s8 h:s9
    hear: "Press [PATTERN]: keys 5 to 9 now light up, because those slots hold data."
  - id: intro-2
    k: play
    t: "Intro: press [STOP], go to B05 (hold [PATTERN], press [TRIG 5]) and press [RECORD]. Select [T1] and press [FUNC] + [PLAY] to clear its trigs. Do the same on [T2], [T4] and [T5]. Press [RECORD] to leave, play it, and save."
    hl: p:stop h:pattern p:s5 p:record h:track p:t1 h:func p:play p:t2 p:t4 p:t5 p:settings
    hear: "Only hats and chords: the idea of the song, waiting for the beat."
  - id: let-intro-play-itself
    k: play
    t: "Let the intro play itself: still in B05, select [T6]. Hold [LFO] and turn [COLOR] a little to the right. Press [LFO], set WAV to RND and MUL to X1, and turn [LFO SPEED] to 32. Then select [T3], hold [LFO], turn [DECAY] a little, set WAV to RND and [LFO SPEED] to 24. Save."
    hl: h:track p:t6 h:lfo t:color p:lfo t:level t:lfospd p:t3 t:decay h:func p:settings
    hear: "Every few bars the chord voicing shifts, and the hats grow longer and shorter on their own clock. The intro now changes while you listen."
  - id: step
    k: play
    t: "A: go to B06, press [RECORD] and clear [T4]. Press [RECORD] to leave. Select [T3] and turn [CHANCE] to about 60%, then select [T6] and turn its [REVERB SEND] down a little. Save. Leave B07 as it is: it's your peak."
    hl: h:pattern p:s6 p:record h:track p:t4 h:func p:play p:t3 t:chance p:t6 t:reverb p:settings
    hear: "Three small changes: one step below the full loop."
  - id: break
    k: play
    t: "Break: go to B08 and clear [T1], [T3] and [T4] the same way. Then turn [REVERB SIZE] up to about 115. Each pattern keeps its own effect settings, so only the break gets the big room. Save."
    hl: h:pattern p:s8 p:record h:track p:t1 p:t3 p:t4 h:func p:play t:revsize p:settings
    hear: "Snare, bass and chords in a huge space: the floor drops out."
  - id: outro
    k: play
    t: "Outro: go to B09 and clear [T1] and [T5]. Select [T6] and turn [DECAY] up so the last chords ring longer. Save."
    hl: h:pattern p:s9 p:record h:track p:t1 p:t5 h:func p:play p:t6 t:decay p:settings
    hear: Kick and bass leave first. The song drifts out on the sounds it started with.
  - id: end-where-began
    k: play
    t: "End where you began: in B09, give [T6] the same random LFO on [COLOR] as in the intro (hold [LFO], turn [COLOR], then WAV RND, MUL X1, [LFO SPEED] 32). Save."
    hl: h:track p:t6 h:lfo t:color p:lfo t:level t:lfospd h:func p:settings
    hear: "The outro drifts like the intro, so the song closes the way it opened."
  - id: chain
    k: play
    t: "Chain it: with the sequencer stopped, hold [PATTERN], then press and hold [TRIG 5]. Keep it held and press [TRIG 6], [TRIG 7], [TRIG 6], [TRIG 7], [TRIG 8], [TRIG 7] and [TRIG 9] in that order. Let go and press [PLAY]."
    hl: h:pattern h:s5 p:s6 p:s7 p:s8 p:s9 p:play
    hear: "Intro, A, B, A, B, break, B, outro: about 85 seconds, then it loops."
  - id: listen-every-change-where
    k: play
    t: Listen to every change. Where one feels too sudden, go to the pattern before it, press [RECORD], press [PAGE] until the 4:4 light is on, and remove a few hats on [T3] so the last bar thins out. Save. Picking a pattern loses the chain, so build it again to listen.
    hl: p:record p:page h:track p:t3 h:func p:settings
    page: 4
    hear: A small gap before a change makes the next section land harder.
  - id: about-how-many-changes
    k: check
    t: About how many changes at once make the ear hear a new section?
    q:
      - One
      - "!About three"
      - Exactly eight
      - As many as possible
    a: About three. One change slips by; around three at once (a part in, a part out, a sound opening up) feels like a new section. Change much more and it sounds like a different song.
    hear: Copy the full loop, take things away, and change about three things per step.
challenge: 'Draw the energy curve of your chain on paper, then the one you drew for Bonobo''s "Kiara". Pick one section to change so your curve looks more like the one you love. Copy it first so the chain stays as it is: hold [PATTERN] + that section''s [TRIG] key and press [RECORD], then hold [PATTERN] + [TRIG 3] and press and hold [STOP] until the countdown finishes. Change the copy in B03 and compare.'
