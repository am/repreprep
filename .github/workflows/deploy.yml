name: Deploy

# Every push to main (every merged PR) deploys to production.
# Every PR from this repo gets a preview at https://pr-<number>-repreprep.<subdomain>.workers.dev,
# which shares the production D1 database. PRs from forks get no secrets, so no preview.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Upload preview version
        id: upload
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -o "https://pr-${{ github.event.pull_request.number }}-[^ ]*workers\.dev" upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment preview link
        if: steps.upload.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            Preview: ${{ steps.upload.outputs.url }}
            Built from ${{ github.event.pull_request.head.sha }}. Shares the production database.
